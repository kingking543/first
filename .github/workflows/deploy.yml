name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 22:15 Asia/Shanghai; 23:15 provides a recovery run.
    - cron: '15 14,15 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v5
        id: pages
      - name: Prepare official draw data
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            npm run data:update
          else
            npm run data:update -- --allow-saved
          fi
        env:
          # Avoid the short IPv4/IPv6 racing timeout on provincial official hosts.
          NODE_OPTIONS: --no-network-family-autoselection --dns-result-order=ipv4first
          DRAW_PUBLISHED_URL: ${{ steps.pages.outputs.base_url }}/data/official-draws.json
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run check:bundle
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
